name: Release to NPM Canary

permissions:
  contents: write
  pull-requests: write

on:
  workflow_dispatch:
  issue_comment:
    types: [created]

concurrency: ${{ github.workflow }}-${{ github.event_name == 'issue_comment' && github.event.issue.number || github.ref }}

jobs:
  resolve:
    name: Resolve release
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.pull_request &&
      contains(fromJSON('["MEMBER", "OWNER", "COLLABORATOR"]'), github.event.comment.author_association) &&
      startsWith(github.event.comment.body, '/canary'))
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.get_pr_head_sha.outputs.sha }}
    steps:
      - name: Get PR head SHA for comment trigger
        if: github.event_name == 'issue_comment'
        id: get_pr_head_sha
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const { data: pr } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: context.issue.number,
            });
            core.setOutput('sha', pr.head.sha);

  release:
    name: Release
    needs: resolve
    cache-mode: read
    uses: ./.github/workflows/_publish-packages.yaml
    with:
      canary: true
      ref: ${{ needs.resolve.outputs.ref }}

  comment-success:
    name: Comment on success
    if: github.event_name == 'issue_comment' && needs.release.outputs.published == 'true'
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Comment on PR with Success
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const workflow_url = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;

            const publishedPackages = JSON.parse(${{ toJSON(needs.release.outputs.published_packages) }});

            let body = `🚀 Canary version published successfully! [View workflow run](${workflow_url})\n\n`;
            body += "The following packages have been published to npm:\n";
            for (const pkg of publishedPackages) {
              body += `* \`${pkg.name}@${pkg.version}\`\n`;
            }

            await github.rest.issues.createComment({ owner, repo, issue_number, body });

  comment-failure:
    name: Comment on failure
    if: >
      always() && github.event_name == 'issue_comment' &&
      (needs.resolve.result == 'failure' || needs.release.result == 'failure')
    needs: [resolve, release]
    runs-on: ubuntu-latest
    steps:
      - name: Comment on PR on Failure
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const workflow_url = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;

            const body = `❌ Canary version deployment failed. [View workflow run](${workflow_url})`;

            await github.rest.issues.createComment({ owner, repo, issue_number, body });
